# Launches the example, waits for network SVGs to render and pages through them.
appId: com.example.example
name: Loads and pages through network SVGs
---
# The SVGs come from upload.wikimedia.org, which now and then rejects a
# request. One retry from a clean launch keeps that from failing the flow.
- retry:
    maxRetries: 1
    commands:
      - launchApp:
          clearState: true
      - assertVisible: "Cached Network SVG Image Demo"
      # The placeholder shows while downloading, then the image's semanticsLabel.
      - extendedWaitUntil:
          visible: "Loading image|SVG image 1"
          timeout: 10000
      - extendedWaitUntil:
          visible: "SVG image 1"
          timeout: 30000
      - tapOn: "Next"
      - extendedWaitUntil:
          visible: "SVG image 2"
          timeout: 30000
      - tapOn: "Next"
      - extendedWaitUntil:
          visible: "SVG image 3"
          timeout: 30000
      - assertNotVisible: "Failed to load image"
