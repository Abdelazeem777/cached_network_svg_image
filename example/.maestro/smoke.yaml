# Launches the example, waits for network SVGs to render and pages through them.
appId: com.example.example
name: Loads and pages through network SVGs
---
# The example sends a descriptive User-Agent, which Wikimedia requires (it
# rejects dart:io's default one with HTTP 429). The retry only covers
# transient network blips: it restarts from a clean launch.
- retry:
    maxRetries: 1
    commands:
      - launchApp:
          clearState: true
      - assertVisible: "Cached Network SVG Image Demo"
      # The placeholder shows while downloading, then the image's semanticsLabel.
      - extendedWaitUntil:
          visible: "Loading image|SVG image 1"
          timeout: 10000
      - extendedWaitUntil:
          visible: "SVG image 1"
          timeout: 20000
      - tapOn: "Next"
      - extendedWaitUntil:
          visible: "SVG image 2"
          timeout: 20000
      - tapOn: "Next"
      - extendedWaitUntil:
          visible: "SVG image 3"
          timeout: 20000
      - assertNotVisible: "Failed to load image"
