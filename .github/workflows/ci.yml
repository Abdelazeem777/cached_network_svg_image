name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      # Infos are reported but not fatal: main has known infos (deprecated
      # color/colorBlendMode kept on purpose, example super parameters).
      # Warnings and errors still fail the build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Build example for web
        working-directory: example
        run: flutter build web

      - name: Build example for web (wasm)
        working-directory: example
        run: flutter build web --wasm

  # The oldest Flutter the package declares (pubspec `flutter: ">=3.22.0"`):
  # checks that the package still resolves, analyzes and passes its tests
  # there. Only the package itself: the example needs Dart >=3.5 (Flutter 3.22
  # ships Dart 3.4), so it stays in the stable job, as does the format check.
  floor:
    name: Flutter 3.22.0 (minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      # --no-example: `flutter pub get` also resolves example/ by default,
      # which cannot resolve on Dart 3.4.
      - name: Install dependencies
        run: flutter pub get --no-example

      - name: Analyze
        run: flutter analyze --no-fatal-infos lib test

      - name: Test
        run: flutter test
